<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--mist:#f5f4ee;--paper:#ffffff;--ink:#1f2a24;--ink-muted:#56605a;--stone:#6b706a;--forest:#2f6b4f;--on-forest:#ffffff;--meadow:#cfe3c8;--river:#2e6f8e;--on-river:#ffffff;--sky:#dbe8ee;--sun:#a8701c;--dawn:#f3e6cc;--ember:#a8432f;--shadow-soft:0 1px 2px rgba(31,42,36,0.06), 0 8px 24px rgba(31,42,36,0.06);--space-1:8px;--space-2:16px;--space-3:32px;--space-4:64px;--space-5:128px;--radius-sm:4px;--radius-lg:12px;--radius-full:9999px;--font-serif:"Fraunces", Georgia, serif;--font-sans:"Figtree", system-ui, sans-serif;--text-display:500 56px/60px var(--font-serif);--text-h1:500 36px/44px var(--font-serif);--text-h2:600 24px/32px var(--font-sans);--text-h3:600 19px/28px var(--font-sans);--text-body:400 17px/28px var(--font-sans);--text-small:400 14px/22px var(--font-sans);--text-label:600 13px/18px var(--font-sans);}}</style>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dis-moi — Quelle lettre, quel chiffre ?</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Figtree:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f6b4f;text-decoration:none}a:hover{color:#1f2a24}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f5f4ee; font-family: 'Figtree', system-ui, sans-serif; color: #1f2a24; display: flex; flex-direction: column; padding: 24px 24px 28px; gap: 20px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Retour aux jeux" style="width: 44px; height: 44px; border-radius: 9999px; background: #ffffff; border: 1px solid #6b706a; display: flex; align-items: center; justify-content: center; color: #1f2a24"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div role="group" aria-label="Type d'image" style="display: flex; background: #ffffff; border: 1px solid #e3e2da; border-radius: 9999px; padding: 4px; gap: 4px">
      <button onClick="{{toLetters}}" style="height: 40px; padding: 0 18px; border-radius: 9999px; border: none; font-family: inherit; font-size: 15px; font-weight: 700; background: {{lettersBg}}; color: {{lettersFg}}">Lettres</button>
      <button onClick="{{toNumbers}}" style="height: 40px; padding: 0 18px; border-radius: 9999px; border: none; font-family: inherit; font-size: 15px; font-weight: 700; background: {{numbersBg}}; color: {{numbersFg}}">Chiffres</button>
    </div>
    <span style="width: 44px"></span>
  </div>

  <div>
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: #2e6f8e">IMAGE</span>
    <h1 style="margin: 4px 0 0; font-family: 'Fraunces', Georgia, serif; font-size: 34px; line-height: 40px; font-weight: 500">{{question}}</h1>
  </div>

  <div style="background: #dbe8ee; border-radius: 24px; height: 340px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
    <span style="font-family: 'Fraunces', Georgia, serif; font-size: 200px; line-height: 210px; font-weight: 600; color: #2e6f8e">{{glyph}}</span>
    <span style="font-size: 14px; color: #56605a">Montre l'écran à l'enfant</span>
  </div>

  <div style="background: #ffffff; border-radius: 12px; padding: 14px 16px; border: 1px solid #e3e2da; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: #56605a">POUR LE PARENT</span>
    <span style="font-size: 16px; line-height: 24px">{{hint}}</span>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button onClick="{{next}}" style="height: 60px; border-radius: 9999px; border: 1px solid #6b706a; background: #ffffff; font-family: inherit; font-size: 17px; font-weight: 600; color: #1f2a24">Passer</button>
    <button onClick="{{next}}" style="height: 60px; border-radius: 9999px; border: none; background: #2f6b4f; font-family: inherit; font-size: 17px; font-weight: 700; color: #ffffff">Trouvé</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'letters', i: 0 }; }
  renderVals() {
    const L = [['B', 'Un mot qui commence par B : ballon'], ['M', 'Un mot qui commence par M : maison'], ['S', 'Un mot qui commence par S : soleil'], ['R', 'Un mot qui commence par R : rivière']];
    const N = [['3', 'Demande de montrer 3 doigts'], ['7', 'Demande de compter jusqu’à 7'], ['5', 'Demande de taper 5 fois dans les mains'], ['9', 'Demande quel chiffre vient avant 9']];
    const letters = this.state.mode === 'letters';
    const list = letters ? L : N;
    const item = list[this.state.i % list.length];
    return {
      glyph: item[0], hint: item[1],
      question: letters ? 'Quelle lettre ?' : 'Quel chiffre ?',
      lettersBg: letters ? '#2e6f8e' : 'transparent', lettersFg: letters ? '#ffffff' : '#1f2a24',
      numbersBg: letters ? 'transparent' : '#2e6f8e', numbersFg: letters ? '#1f2a24' : '#ffffff',
      toLetters: () => this.setState({ mode: 'letters', i: 0 }),
      toNumbers: () => this.setState({ mode: 'numbers', i: 0 }),
      next: () => this.setState({ i: this.state.i + 1 })
    };
  }
}
</script>
</body>
</html>
