<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--mist:#f5f4ee;--paper:#ffffff;--ink:#1f2a24;--ink-muted:#56605a;--stone:#6b706a;--forest:#2f6b4f;--on-forest:#ffffff;--meadow:#cfe3c8;--river:#2e6f8e;--on-river:#ffffff;--sky:#dbe8ee;--sun:#a8701c;--dawn:#f3e6cc;--ember:#a8432f;--shadow-soft:0 1px 2px rgba(31,42,36,0.06), 0 8px 24px rgba(31,42,36,0.06);--space-1:8px;--space-2:16px;--space-3:32px;--space-4:64px;--space-5:128px;--radius-sm:4px;--radius-lg:12px;--radius-full:9999px;--font-serif:"Fraunces", Georgia, serif;--font-sans:"Figtree", system-ui, sans-serif;--text-display:500 56px/60px var(--font-serif);--text-h1:500 36px/44px var(--font-serif);--text-h2:600 24px/32px var(--font-sans);--text-h3:600 19px/28px var(--font-sans);--text-body:400 17px/28px var(--font-sans);--text-small:400 14px/22px var(--font-sans);--text-label:600 13px/18px var(--font-sans);}}</style>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dis-moi — Quelle chanson ?</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Figtree:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f6b4f;text-decoration:none}a:hover{color:#1f2a24}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f5f4ee; font-family: 'Figtree', system-ui, sans-serif; color: #1f2a24; display: flex; flex-direction: column; padding: 24px 24px 28px; gap: 20px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Retour aux jeux" style="width: 44px; height: 44px; border-radius: 9999px; background: #ffffff; border: 1px solid #6b706a; display: flex; align-items: center; justify-content: center; color: #1f2a24"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 14px; font-weight: 600; color: #56605a">Manche {{round}} sur 10</span>
    <span style="height: 36px; padding: 0 14px; border-radius: 9999px; background: #f3e6cc; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="#a8701c" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>{{stars}}</span>
  </div>

  <div>
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: #2f6b4f">MUSIQUE</span>
    <h1 style="margin: 4px 0 0; font-family: 'Fraunces', Georgia, serif; font-size: 34px; line-height: 40px; font-weight: 500">Quelle chanson ?</h1>
  </div>

  <div style="background: #cfe3c8; border-radius: 20px; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 20px">
    <div style="display: flex; align-items: center; gap: 5px; height: 64px" aria-hidden="true">
      <span style="width: 6px; height: 18px; border-radius: 3px; background: #2f6b4f"></span><span style="width: 6px; height: 38px; border-radius: 3px; background: #2f6b4f"></span><span style="width: 6px; height: 56px; border-radius: 3px; background: #2f6b4f"></span><span style="width: 6px; height: 30px; border-radius: 3px; background: #2f6b4f"></span><span style="width: 6px; height: 46px; border-radius: 3px; background: #2f6b4f"></span><span style="width: 6px; height: 64px; border-radius: 3px; background: #2f6b4f"></span><span style="width: 6px; height: 40px; border-radius: 3px; background: #2f6b4f"></span><span style="width: 6px; height: 22px; border-radius: 3px; background: #6b706a"></span><span style="width: 6px; height: 48px; border-radius: 3px; background: #6b706a"></span><span style="width: 6px; height: 34px; border-radius: 3px; background: #6b706a"></span><span style="width: 6px; height: 54px; border-radius: 3px; background: #6b706a"></span><span style="width: 6px; height: 26px; border-radius: 3px; background: #6b706a"></span><span style="width: 6px; height: 14px; border-radius: 3px; background: #6b706a"></span>
    </div>
    <button aria-label="Écouter l'extrait" style="width: 96px; height: 96px; border-radius: 9999px; border: none; background: #2f6b4f; color: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(31,42,36,0.18)"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></button>
    <span style="font-size: 15px; color: #1f2a24">Extrait de 10 secondes · 0:04</span>
  </div>

  <div style="background: #ffffff; border-radius: 12px; padding: 16px; border: 1px solid #e3e2da; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: #56605a">POUR LE PARENT</span>
    <sc-if value="{{revealed}}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 20px; font-weight: 700">[Titre de la chanson]</span>
      <span style="font-size: 14px; color: #56605a">Indice : on la chante à l'école</span>
    </sc-if>
    <sc-if value="{{hidden}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{reveal}}" style="height: 44px; border-radius: 9999px; border: 1px solid #6b706a; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: #1f2a24">Voir la réponse</button>
    </sc-if>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button onClick="{{next}}" style="height: 60px; border-radius: 9999px; border: 1px solid #6b706a; background: #ffffff; font-family: inherit; font-size: 17px; font-weight: 600; color: #1f2a24">Pas encore</button>
    <button onClick="{{found}}" style="height: 60px; border-radius: 9999px; border: none; background: #2f6b4f; font-family: inherit; font-size: 17px; font-weight: 700; color: #ffffff">Trouvé</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { round: 3, stars: 4, revealed: false }; }
  renderVals() {
    const s = this.state;
    const advance = (gain) => this.setState({ round: s.round >= 10 ? 1 : s.round + 1, stars: s.stars + gain, revealed: false });
    return {
      round: s.round, stars: s.stars, revealed: s.revealed, hidden: !s.revealed,
      reveal: () => this.setState({ revealed: true }),
      found: () => advance(1), next: () => advance(0)
    };
  }
}
</script>
</body>
</html>
