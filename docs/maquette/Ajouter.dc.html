<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--mist:#f5f4ee;--paper:#ffffff;--ink:#1f2a24;--ink-muted:#56605a;--stone:#6b706a;--forest:#2f6b4f;--on-forest:#ffffff;--meadow:#cfe3c8;--river:#2e6f8e;--on-river:#ffffff;--sky:#dbe8ee;--sun:#a8701c;--dawn:#f3e6cc;--ember:#a8432f;--shadow-soft:0 1px 2px rgba(31,42,36,0.06), 0 8px 24px rgba(31,42,36,0.06);--space-1:8px;--space-2:16px;--space-3:32px;--space-4:64px;--space-5:128px;--radius-sm:4px;--radius-lg:12px;--radius-full:9999px;--font-serif:"Fraunces", Georgia, serif;--font-sans:"Figtree", system-ui, sans-serif;--text-display:500 56px/60px var(--font-serif);--text-h1:500 36px/44px var(--font-serif);--text-h2:600 24px/32px var(--font-sans);--text-h3:600 19px/28px var(--font-sans);--text-body:400 17px/28px var(--font-sans);--text-small:400 14px/22px var(--font-sans);--text-label:600 13px/18px var(--font-sans);}}</style>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dis-moi — Ajouter un jeu</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Figtree:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f6b4f;text-decoration:none}a:hover{color:#1f2a24}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f5f4ee; font-family: 'Figtree', system-ui, sans-serif; color: #1f2a24; display: flex; flex-direction: column; padding: 24px 24px 28px; gap: 16px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Retour aux jeux" style="width: 44px; height: 44px; border-radius: 9999px; background: #ffffff; border: 1px solid #6b706a; display: flex; align-items: center; justify-content: center; color: #1f2a24"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 14px; font-weight: 600; color: #56605a">{{count}} jeux dans l'appli</span>
  </div>

  <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 34px; line-height: 40px; font-weight: 500">Ajouter un jeu</h1>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: #56605a">CATALOGUE</span>
    <sc-for list="{{games}}" as="g" hint-placeholder-count="4">
      <div style="background: #ffffff; border-radius: 12px; border: 1px solid #e3e2da; padding: 12px 12px 12px 14px; display: flex; align-items: center; gap: 12px">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: {{g.tint}}; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-size: 20px; font-weight: 600; color: #1f2a24">{{g.mark}}</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">{{g.name}}</span><span style="font-size: 13px; color: #56605a">{{g.desc}}</span></span>
        <button onClick="{{g.toggle}}" style="height: 40px; padding: 0 14px; border-radius: 9999px; font-family: inherit; font-size: 14px; font-weight: 700; border: {{g.border}}; background: {{g.bg}}; color: {{g.fg}}">{{g.label}}</button>
      </div>
    </sc-for>
  </div>

  <div style="background: #dbe8ee; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 17px; font-weight: 700">Créer mon propre jeu</span>
    <label for="nom" style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em">Nom du jeu</label>
    <input id="nom" placeholder="Ex. : Quel est ce bruit ?" style="height: 44px; border-radius: 4px; border: 1px solid #6b706a; background: #ffffff; padding: 0 12px; font-family: inherit; font-size: 16px; color: #1f2a24">
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="height: 32px; padding: 0 12px; border-radius: 9999px; background: #2e6f8e; color: #ffffff; font-size: 13px; font-weight: 700; display: flex; align-items: center">Son</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 9999px; background: #ffffff; font-size: 13px; font-weight: 600; display: flex; align-items: center">Image</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 9999px; background: #ffffff; font-size: 13px; font-weight: 600; display: flex; align-items: center">Mot à dessiner</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 9999px; background: #ffffff; font-size: 13px; font-weight: 600; display: flex; align-items: center">Question</span>
    </div>
    <button style="height: 48px; border-radius: 9999px; border: none; background: #2f6b4f; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 700">Ajouter les questions</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { added: { animal: true } }; }
  renderVals() {
    const base = [
      { id: 'animal', mark: 'Cri', name: 'Quel animal ?', desc: 'Écoute le cri, devine', tint: '#cfe3c8' },
      { id: 'couleur', mark: 'Aa', name: 'Quelle couleur ?', desc: 'Nomme la couleur montrée', tint: '#f3e6cc' },
      { id: 'mime', mark: 'Mi', name: 'Mime ça', desc: 'L’enfant mime, le parent devine', tint: '#dbe8ee' },
      { id: 'devinette', mark: '?', name: 'Devinettes', desc: 'Des énigmes à lire à voix haute', tint: '#cfe3c8' }
    ];
    const added = this.state.added;
    const games = base.map((g) => {
      const on = !!added[g.id];
      return { ...g,
        label: on ? 'Ajouté' : 'Ajouter',
        bg: on ? '#cfe3c8' : '#2f6b4f', fg: on ? '#1f2a24' : '#ffffff', border: on ? '1px solid #2f6b4f' : 'none',
        toggle: () => this.setState({ added: { ...added, [g.id]: !on } }) };
    });
    return { games, count: 3 + Object.values(added).filter(Boolean).length };
  }
}
</script>
</body>
</html>
