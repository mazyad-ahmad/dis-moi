<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--mist:#f5f4ee;--paper:#ffffff;--ink:#1f2a24;--ink-muted:#56605a;--stone:#6b706a;--forest:#2f6b4f;--on-forest:#ffffff;--meadow:#cfe3c8;--river:#2e6f8e;--on-river:#ffffff;--sky:#dbe8ee;--sun:#a8701c;--dawn:#f3e6cc;--ember:#a8432f;--shadow-soft:0 1px 2px rgba(31,42,36,0.06), 0 8px 24px rgba(31,42,36,0.06);--space-1:8px;--space-2:16px;--space-3:32px;--space-4:64px;--space-5:128px;--radius-sm:4px;--radius-lg:12px;--radius-full:9999px;--font-serif:"Fraunces", Georgia, serif;--font-sans:"Figtree", system-ui, sans-serif;--text-display:500 56px/60px var(--font-serif);--text-h1:500 36px/44px var(--font-serif);--text-h2:600 24px/32px var(--font-sans);--text-h3:600 19px/28px var(--font-sans);--text-body:400 17px/28px var(--font-sans);--text-small:400 14px/22px var(--font-sans);--text-label:600 13px/18px var(--font-sans);}}</style>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dis-moi — Dessine ça</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Figtree:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f6b4f;text-decoration:none}a:hover{color:#1f2a24}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f5f4ee; font-family: 'Figtree', system-ui, sans-serif; color: #1f2a24; display: flex; flex-direction: column; padding: 24px 24px 28px; gap: 18px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Retour aux jeux" style="width: 44px; height: 44px; border-radius: 9999px; background: #ffffff; border: 1px solid #6b706a; display: flex; align-items: center; justify-content: center; color: #1f2a24"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 9999px; background: #f3e6cc; font-weight: 700; font-size: 17px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f2a24" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M10 3h4"></path></svg>0:42
    </div>
  </div>

  <div>
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: #a8701c">DESSIN</span>
    <h1 style="margin: 4px 0 0; font-family: 'Fraunces', Georgia, serif; font-size: 34px; line-height: 40px; font-weight: 500">Dessine ça</h1>
  </div>

  <div style="background: #2f6b4f; border-radius: 16px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; color: #ffffff">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em">LE PARENT LIT À VOIX HAUTE</span>
      <span style="font-family: 'Fraunces', Georgia, serif; font-size: 30px; line-height: 36px; font-weight: 600">{{word}}</span>
    </div>
    <button onClick="{{nextWord}}" aria-label="Autre mot" style="width: 44px; height: 44px; border-radius: 9999px; border: 1px solid #ffffff; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v5h-5"></path></svg></button>
  </div>

  <div style="flex-grow: 1; background: #ffffff; border-radius: 16px; border: 1px solid #e3e2da; position: relative; display: flex; align-items: center; justify-content: center">
    <svg width="220" height="200" viewBox="0 0 220 200" fill="none" stroke="#1f2a24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M60 70l10-40 25 30M160 70l-10-40-25 30"></path><ellipse cx="110" cy="100" rx="60" ry="50"></ellipse><circle cx="88" cy="92" r="5" fill="#1f2a24"></circle><circle cx="132" cy="92" r="5" fill="#1f2a24"></circle><path d="M104 112l6 6 6-6M40 105h35M40 120l35-5M180 105h-35M180 120l-35-5"></path><path d="M80 170c20 12 40 12 60 0" stroke="#a8701c"></path></svg>
    <span style="position: absolute; left: 16px; bottom: 12px; font-size: 13px; color: #56605a">L'enfant dessine avec le doigt</span>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div role="group" aria-label="Couleurs" style="display: flex; gap: 10px">
      <button aria-label="Noir" style="width: 44px; height: 44px; border-radius: 9999px; border: 3px solid #2e6f8e; background: #1f2a24"></button>
      <button aria-label="Vert" style="width: 44px; height: 44px; border-radius: 9999px; border: none; background: #2f6b4f"></button>
      <button aria-label="Bleu" style="width: 44px; height: 44px; border-radius: 9999px; border: none; background: #2e6f8e"></button>
      <button aria-label="Or" style="width: 44px; height: 44px; border-radius: 9999px; border: none; background: #a8701c"></button>
    </div>
    <button aria-label="Effacer" style="width: 44px; height: 44px; border-radius: 9999px; border: 1px solid #6b706a; background: #ffffff; color: #1f2a24; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"></path></svg></button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button onClick="{{nextWord}}" style="height: 60px; border-radius: 9999px; border: 1px solid #6b706a; background: #ffffff; font-family: inherit; font-size: 17px; font-weight: 600; color: #1f2a24">Passer</button>
    <button onClick="{{nextWord}}" style="height: 60px; border-radius: 9999px; border: none; background: #2f6b4f; font-family: inherit; font-size: 17px; font-weight: 700; color: #ffffff">C'est fini</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { i: 0 }; }
  renderVals() {
    const words = ['Un chat', 'Une maison', 'Un arbre', 'Le soleil', 'Un bateau'];
    return {
      word: words[this.state.i % words.length],
      nextWord: () => this.setState({ i: this.state.i + 1 })
    };
  }
}
</script>
</body>
</html>
